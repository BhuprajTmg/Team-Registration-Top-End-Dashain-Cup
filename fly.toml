# Fly.io app config — always-on free-tier friendly deploy.
# Docs: https://fly.io/docs/
#
# First-time setup (from your laptop, in this repo):
#   1. Install flyctl: https://fly.io/docs/hands-on/install-flyctl/
#   2. fly auth login
#   3. fly launch --no-deploy   # accept this fly.toml; do NOT create a Fly Postgres
#   4. Create a free Neon DB (https://neon.tech) and set secrets (see README)
#   5. fly deploy
#
# Keep at least 1 machine running so the site does not sleep.

app = 'dashain-cup'
primary_region = 'syd'

[build]

[deploy]
  release_command = 'python manage.py migrate --no-input'

[env]
  DJANGO_DEBUG = 'False'
  CLUB_NAME = 'Gurkhali FC'
  DJANGO_TIME_ZONE = 'Australia/Darwin'
  PORT = '8000'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
