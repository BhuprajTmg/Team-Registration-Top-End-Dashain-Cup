# Fly.io app config for Gurkhali FC Dashain Cup.
# Docs: https://fly.io/docs/
#
# Deploy from your laptop (after fly auth login + billing):
#   fly apps create gurkhalifc-dashain-cup
#   fly secrets set ...   # see README
#   fly deploy -a gurkhalifc-dashain-cup
#
# Live URL: https://gurkhalifc-dashain-cup.fly.dev/

app = 'gurkhalifc-dashain-cup'
primary_region = 'syd'

[build]

[deploy]
  release_command = 'python manage.py migrate --no-input'

[env]
  DJANGO_DEBUG = 'False'
  CLUB_NAME = 'Gurkhali FC'
  DJANGO_TIME_ZONE = 'Australia/Darwin'
  PORT = '8000'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
